syntax = "proto3";

package sdv.authz.policy.acl_policy;

// AclPolicy defines the Access control policies for Unit Types and Service
// Units.
//
// Service bundle manifest file may include a path to a policy file that
// includes an AclPolicy proto.

message AclPolicy {
  // Required. List of ACLs.
  //
  // ACL names should be unique for this AclPolicy message.
  repeated Acl acls = 1;

  // Optional. List of Access Control policy for Unit Types.
  //
  // Unit Type names should be unique for this AclPolicy message.
  repeated UnitAclMapping unit_types = 2;

  // Optional. List of Access Control policy for Service Units.
  //
  // Service Unit names should be unique for this AclPolicy message.
  repeated UnitAclMapping service_units = 3;
}

message Acl {
  // Required. Name of the Access Control List.
  string name = 1;
  // Optional % NOTE. List of ACL expressions which control allow access to the
  // guarded Unit.
  //
  // NOTE: At least one expression has to be defined either in `include` or
  // `never_include` fields.
  repeated string include = 2;
  // Optional % NOTE. List of ACL expressions which control deny access to the
  // guarded Unit.
  //
  // NOTE: At least one expression has to be defined either in `include` or
  // `never_include` fields.
  repeated string never_include = 3;
}

// Defines a mapping between Unit (either Unit Type or Service Unit) and its
// ACLs.
message UnitAclMapping {
  // Required.
  //
  // In case of a Service Unit, this is the name of a Service Unit as provided
  // during Service Unit Registration via Service Discovery.
  string name = 1;

  // Required. List of ACL Names that are guarding the Unit.
  //
  // All ACLs that are referred here has to be defined in the parent proto
  // message. Otherwise accessing the Service Unit is impossible.
  repeated string acl_names = 2;
}
