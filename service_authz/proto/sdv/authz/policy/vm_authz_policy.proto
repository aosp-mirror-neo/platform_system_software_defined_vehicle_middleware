syntax = "proto3";

package sdv.authz.policy.vm_authz_policy;

// VmAuthzPolicy defines the authorization policies for a remote VM.
//
// The policy is evaluated in the following way:
//  - If no allow rule matches a requested action, it's denied by default.
//  - If there's an allow rule for a requested action, it's allowed unless there's an equal or more
//  specific deny rule.
//  - If there's a deny rule for a requested action, it's denied unless there's a strictly more
//  specific allow rule.
//
// Where "more specific" is defined by the following hierarchy:
// 1.  A rule with a specific 'message'/'service' name is more specific
//     than a rule with '*' for 'message'/'service'.
// 2.  If 'message'/'service' fields are both specific names,
//     a rule with specific 'topic'/'channel' names is more specific
//     than a rule with '*' for 'topic'/'channel'.
//
// For example:
// - `message: "a.b", topic: "*"` is more specific than `message: "*", topic: "*"`.
// - `message: "a.b", topic: "t1"` is more specific than `message: "a.b", topic: "*"`.
// - `message: "a.b", topic: "t1"` is more specific than `message: "*", topic: "*"`.
message VmAuthzPolicy {
  // Optional. List of permissions to publish Data Tunnel publications.
  repeated Publisher allow_publisher = 1;

  // Optional. List of permissions to discover and subscribe to Data Tunnel
  // publications.
  repeated Subscriber allow_subscriber = 2;

  // Optional. List of permissions to serve an RPC server.
  repeated Server allow_server = 3;

  // Optional. List of permissions to discover and call methods of an RPC
  // server.
  repeated Client allow_client = 4;

  // Optional. List of permissions to explicitly deny publishing Data Tunnel publications.
  repeated Publisher deny_publisher = 5;

  // Optional. List of permissions to explicitly deny subscribing to Data Tunnel publications.
  repeated Subscriber deny_subscriber = 6;

  // Optional. List of permissions to explicitly deny serving an RPC server.
  repeated Server deny_server = 7;

  // Optional. List of permissions to explicitly deny calling methods of an RPC server.
  repeated Client deny_client = 8;
}

// Defines a permission to allow/deny publishing Data Tunnel publications.
message Publisher {
  // Required. Publication's fully qualified protobuf message name or "*" to allow/deny all
  // messages.
  //
  // "*" is only allowed if "topic" field is "*".
  string message = 1;

  // Required. Topic(s) to which this permission allows/denies publishing.
  //
  // Value can be either a specific topic name or "*" to allow/deny all topics.
  repeated string topic = 2;
}

// Defines a permission to discover and subscribe to Data Tunnel publications.
message Subscriber {
  // Required. Publication's fully qualified protobuf message name or "*" to allow/deny all
  // messages.
  //
  // "*" is only allowed if "topic" field is "*".
  string message = 1;

  // Required. Topic(s) to which this permission allows/denies subscribing.
  //
  // Value can be either a specific topic name or "*" to allow/deny all topics.
  repeated string topic = 2;
}

// Defines a permission to serve an RPC server.
message Server {
  // Required. Server's fully qualified protobuf service name or "*" to allow/deny all services.
  //
  // "*" is only allowed if "channel" field is "*".
  string service = 1;

  // Required. Channel(s) on which this permission allows/denies server registration.
  //
  // Value can be either a specific channel name or "*" to allow/deny all channels.
  repeated string channel = 2;
}

// Defines a permission to discover and call methods of an RPC server.
message Client {
  // Required. Server's fully qualified protobuf service name or "*" to allow/deny all services.
  //
  // "*" is only allowed if "channel" field is "*".
  string service = 1;

  // Required. Channel(s) on which this permission allows/denies client discovery and method calls.
  //
  // Value can be either a specific channel name or "*" to allow/deny all channels.
  repeated string channel = 2;
}
