syntax = "proto3";
package sdv_sd_mesh.identity;

message ServiceIdentity {
  int64 sid = 1;

  message EcPublicKey {
    bytes key_value = 1;
  }

  EcPublicKey public_key = 2;
  ServiceFqin name = 3;
}

message ServiceFqin {
  string sdv_vm_name = 1;
  string sdv_package_name = 2;
  string service_bundle_name = 3;
  string service_instance_name = 4;
}

message ServiceUnitIdentifier {
  int64 sid = 1;
  string service_unit_name = 2;
}