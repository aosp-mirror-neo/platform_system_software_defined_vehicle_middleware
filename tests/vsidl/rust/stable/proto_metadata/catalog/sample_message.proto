syntax = "proto3";

package sdv.vsidl.test.stable.metadata;

import "sdv/vsidl/v1/annotations.proto";

import "google/protobuf/wrappers.proto";
import "reference.proto";
import "dir/childdir.proto";
import "another.proto";

enum SampleVariants {
  FOO = 0;
  BAR = 1;
}

message SampleMessage {
  option (.sdv.vsidl.v1.publication) = {
    instances_enum: "SampleVariants"
    message_count: 8
    model: SINGLE_PUB
  };

  message Nested {
    uint32 value = 1;
  }

  uint32 direct = 1;
  Nested nested = 2;
  Sibling ref_to_same_file = 3;
  google.protobuf.BoolValue ref_to_well_known = 4;
  Neighbor ref_to_diff_file = 5;
  .sdv.vsidl.test.stable.metadata.child.Child ref_to_diff_dir = 6;
  .sdv.vsidl.test.stable.metadata.another.Another ref_to_diff_catalog = 7;
}

message Sibling {
  uint32 value = 1;
}
