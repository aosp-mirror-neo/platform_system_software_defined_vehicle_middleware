include_version = true
braces = "SameLine"
line_length = 100
tab_width = 2
language = "C"
cpp_compat = true
pragma_once = true
no_includes = true
sys_includes = ["sdv/status.h", "stdbool.h", "stdint.h"]
usize_is_size_t = true
header = """
// Copyright (C) 2026 The Android Open Source Project
