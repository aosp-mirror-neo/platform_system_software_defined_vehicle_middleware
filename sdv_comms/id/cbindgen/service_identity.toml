// distributed under the License is distributed on an "AS IS" BASIS,
// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
// See the License for the specific language governing permissions and
// limitations under the License.
"""
autogen_warning = """
/* clang-format off */

/**
 * Don't modify manually. This file is autogenerated by running the following commands manually:
 *
 *   cd libsdv_comms_id/
 *   cbindgen --config cbindgen/service_identity.toml src/ffi/service_identity.rs | ${ANDROID_BUILD_TOP}/prebuilts/clang/host/linux-x86/clang-stable/bin/clang-format > include_c_abi/current/sdv/service_identity.h
 */

/* clang-format on */
"""
documentation = true
style = "type"

includes = ["sdv/service_fqin.h"]

[export]
# Remove this list once the following types will be used by functions.
include = ["ASDV_ServiceIdentity", "ASDV_UnitIdentifier"]
exclude = ["sdv_status_t"]
